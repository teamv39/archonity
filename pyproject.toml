[project]
name = "archonity"
version = "0.1.0"
description = "Archonity: static microservice dependency graph reconstruction for TechArena 2026"
requires-python = ">=3.11"
# Версии — как в окружении, где построены кеши и рекорд (21.10); requirements.txt — экспорт uv.lock.
# Эмбеддер (sentence-transformers, torch) обязателен для финального запуска (roadmap, П1): на новых сценариях он считает
# векторы шагов. Прогон из кеша cache/emb/ грузит его лениво и без него обходится.
# torch — сборка CUDA 12.8 с download.pytorch.org (A100 и RTX 50 / SM120), не CUDA 13 с PyPI: та требует драйвер 580+.
# EmbeddingGemma 2 в sentence-transformers 6.1 требует torchvision даже в текстовом режиме.
# jsonschema — для scripts/verify_llm_cache.py: без него ответы кеша LLM не сверяются со схемой запроса.
dependencies = [
    "huggingface-hub==1.33.0",
    "jsonschema==4.26.0",
    "networkx==3.6.1",
    "numpy==2.4.4",
    "sentence-transformers==6.1.0",
    "torch==2.11.0",
    "torchvision==0.26.0",
    "transformers==5.20.1",
    "tree-sitter==0.26.0",
    "tree-sitter-javascript==0.25.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
# Причины пропусков (нет бинарника Rust, кеша LLM, пакета задачи) — в итоге прогона
addopts = "-rs"
